[project]
name = "slabwatch"
version = "0.1.0"
description = "Forecast this billing cycle's electricity units before the 200-unit cliff (TabPFN quantiles + plain-code decisions)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Arqam Waheed" }]
# Core = what Render runs. No torch here.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "tabpfn-client>=0.6.1",
]

[project.optional-dependencies]
local = ["tabpfn>=9.2"]                         # TabPFN-3.5 local weights + torch (heavy; laptop only)
db = ["psycopg[binary]>=3.2"]                   # Tiger Cloud / Postgres
temporal = ["temporalio>=1.7"]
browser = ["browserbase>=1.4", "playwright>=1.45"]  # connect_over_cdp; no local browser download needed
data = ["libarchive-c>=5.1"]                    # RAR fallback when unar/unrar/7z are absent
dev = ["pytest>=8", "httpx>=0.27"]
all = ["slabwatch[db,temporal,browser,data,dev]"]

[project.scripts]
slabwatch = "slabwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slabwatch*"]

[tool.setuptools.package-data]
slabwatch = ["sql/*.sql", "static/*", "assets/*.parquet"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
